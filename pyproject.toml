[project]
name = "smartstudytaskmanagerv1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.4",
    "flet-android-notifications>=0.12.0",
    "httpx>=0.27,<1",
    "python-dotenv>=1.2.4",
]

[tool.flet.app]
include = [
    ".env",
    ".env.example"
]

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

[tool.flet.android]
split_per_abi = false
target_arch = ["arm64-v8a"]
legacy_packaging = true

[tool.flet.android.app]
exclude = [
    "docs",
    "tests",
    "node_modules",
    "functions",
    "public",
    "firebase-tools-instant-win.exe",
    "firestore-debug.log",
    "firebase-config.json",
    "firebase.json",
    "firestore.indexes.json",
    "firestore.rules",
    "google-services.json",
    "package.json",
    "package-lock.json",
    "README.md",
    "smartstudytaskmanagerv1-firebase-adminsdk-fbsvc-19f9361452.json",
]
